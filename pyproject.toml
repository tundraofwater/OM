[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overlapmix-dd"
version = "0.1.0"
description = "Teacher-guided patch selection and overlap-aware image composition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "Pillow>=9", "torch>=2.1", "torchvision>=0.16", "tqdm>=4.65"]

[project.scripts]
overlapmix = "overlapmix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

